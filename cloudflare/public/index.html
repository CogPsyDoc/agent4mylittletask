<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowork Sync — 실시간 에이전트</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --border: #2a2f3a;
    --text: #e6e9ef; --dim: #8b93a3; --accent: #7aa2f7; --ok: #9ece6a; --warn: #e0af68; --err: #f7768e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); display: inline-block; }
  .dot.on { background: var(--ok); }
  .badge { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--dim); }
  main { display: grid; grid-template-columns: 320px 1fr 300px; gap: 12px; padding: 12px 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1100px) { main { grid-template-columns: 280px 1fr; } #side { grid-column: 1 / -1; } }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 200px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .list { overflow-y: auto; max-height: 70vh; }
  .item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover, .item.active { background: var(--panel2); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { color: var(--dim); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .star { cursor: pointer; opacity: .45; } .star.on { opacity: 1; }
  #detail { min-height: 60vh; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; max-height: 62vh; }
  .msg { margin-bottom: 12px; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .msg .body { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .body { border-left: 3px solid var(--accent); }
  .msg.assistant .body { border-left: 3px solid var(--ok); }
  .msg.tool .body { color: var(--dim); font-size: 12px; max-height: 140px; overflow-y: auto; }
  .msg.continued .who::after { content: " · 이어진 대화"; color: var(--warn); }
  #chatbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  #chatbar textarea { flex: 1; resize: none; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 10px; font: inherit; height: 60px; }
  button { background: var(--accent); color: #0c1020; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .box { padding: 12px; border-bottom: 1px solid var(--border); }
  .box label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .box input { width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 7px 10px; font: inherit; margin-bottom: 8px; }
  #activity { overflow-y: auto; max-height: 30vh; font-size: 12px; }
  #activity div { padding: 6px 12px; border-bottom: 1px solid var(--border); color: var(--dim); }
  #activity b { color: var(--text); font-weight: 600; }
  #reminders div { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  #reminders a { color: var(--err); cursor: pointer; }
  .empty { color: var(--dim); padding: 24px 12px; text-align: center; font-size: 13px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 16px; display: none; z-index: 10; max-width: 90vw; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>💬 Cowork Sync <span style="color:var(--dim);font-weight:400">— Cloudflare 실시간 에이전트</span></h1>
  <span class="badge" id="room">room: -</span>
  <span class="badge" id="presence">접속 기기 0</span>
  <span class="badge" id="chatState">채팅: 확인 중…</span>
</header>

<main>
  <section class="panel">
    <h2>세션 <span id="count"></span></h2>
    <div class="list" id="sessions"><div class="empty">아직 동기화된 세션이 없어요.<br><code>npm run sync</code>로 로컬 트랜스크립트를 올려보세요.</div></div>
  </section>

  <section class="panel" id="detail">
    <h2 id="detailTitle">세션을 선택하세요</h2>
    <div id="msgs"><div class="empty">왼쪽 목록에서 세션을 열면 대화가 표시됩니다.<br>여기서 보낸 채팅은 <b>접속한 모든 기기</b>에 실시간으로 스트리밍돼요.</div></div>
    <div id="chatbar">
      <textarea id="input" placeholder="이어서 대화하기… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button id="send" disabled>전송</button>
    </div>
  </section>

  <section class="panel" id="side">
    <h2>⏰ 리마인더 (에이전트 예약 작업)</h2>
    <div class="box">
      <label>메모</label>
      <input id="rNote" placeholder="예: PR 리뷰 확인하기">
      <label>몇 초 후?</label>
      <input id="rSec" type="number" value="60" min="5">
      <button class="ghost" id="rAdd">예약</button>
    </div>
    <div id="reminders"></div>
    <h2>📡 활동 (실시간)</h2>
    <div id="activity"></div>
  </section>
</main>
<div id="toast"></div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const room = (qs.get("room") || "main").replace(/[^\w-]/g, "") || "main";
  const $ = (id) => document.getElementById(id);
  const state = { sessions: [], current: null, streaming: null, ws: null, retry: 0, token: "" };

  $("room").textContent = "room: " + room;

  // VIEW_TOKEN 이 설정된 워커라면 토큰을 받아 저장한다 (401 → 프롬프트)
  async function ensureToken() {
    let token = qs.get("token") || localStorage.getItem("cowork_view_token") || "";
    for (;;) {
      try {
        const res = await fetch(`/agents/cowork-agent/${room}/health` + (token ? `?token=${encodeURIComponent(token)}` : ""));
        if (res.status !== 401) { state.token = token; if (token) localStorage.setItem("cowork_view_token", token); return true; }
      } catch { return true; } // 네트워크 오류는 WS 재시도 루프에 맡긴다
      token = prompt("이 룸은 보호되어 있어요. 접속 토큰(VIEW_TOKEN)을 입력하세요:") || "";
      if (!token) { toast("⚠️ 토큰이 없으면 접속할 수 없어요. 새로고침 후 다시 시도하세요."); return false; }
    }
  }

  async function connect() {
    if (!(await ensureToken())) return;
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const tokenQs = state.token ? `?token=${encodeURIComponent(state.token)}` : "";
    const ws = new WebSocket(`${proto}//${location.host}/agents/cowork-agent/${room}${tokenQs}`);
    state.ws = ws;

    ws.onopen = () => { $("dot").classList.add("on"); state.retry = 0; };
    ws.onclose = () => {
      $("dot").classList.remove("on");
      setTimeout(connect, Math.min(1000 * 2 ** state.retry++, 15000));
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (typeof m.type === "string" && m.type.startsWith("cf_")) return; // SDK 내부 메시지
      handle(m);
    };
  }

  function send(obj) {
    if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(obj));
  }

  function handle(m) {
    switch (m.type) {
      case "welcome":
        $("chatState").textContent = m.chatEnabled ? `채팅: ${m.model}` : "채팅: 꺼짐 (API 키 없음)";
        $("presence").textContent = `접속 기기 ${m.presence}`;
        state.sessions = m.sessions; renderSessions();
        renderActivity(m.activity);
        send({ type: "list_reminders" });
        if (state.current) send({ type: "open", sessionId: state.current });
        break;
      case "presence": $("presence").textContent = `접속 기기 ${m.count}`; break;
      case "sessions": state.sessions = m.sessions; renderSessions(); break;
      case "session_detail": if (m.sessionId === state.current) renderDetail(m); break;
      case "activity": renderActivity(m.items); break;
      case "reminders": renderReminders(m.items); break;
      case "reminder": toast("⏰ " + m.note); break;
      case "chat_user":
        if (m.sessionId === state.current) addMsg("user", m.text, true);
        break;
      case "chat_delta":
        if (m.sessionId === state.current) {
          if (!state.streaming) state.streaming = addMsg("assistant", "", true);
          state.streaming.textContent += m.text;
          $("msgs").scrollTop = $("msgs").scrollHeight;
        }
        break;
      case "chat_done":
        state.streaming = null; $("send").disabled = !state.current;
        break;
      case "chat_error":
        state.streaming = null; $("send").disabled = !state.current;
        toast("⚠️ " + m.message);
        break;
      case "error": toast("⚠️ " + m.message); break;
    }
  }

  // ---- 렌더링 ----
  function renderSessions() {
    const el = $("sessions");
    $("count").textContent = state.sessions.length ? `(${state.sessions.length})` : "";
    if (!state.sessions.length) return;
    el.innerHTML = "";
    for (const s of state.sessions) {
      const d = document.createElement("div");
      d.className = "item" + (s.id === state.current ? " active" : "");
      const star = document.createElement("span");
      star.className = "star" + (s.favorite ? " on" : "");
      star.textContent = "⭐";
      star.onclick = (ev) => { ev.stopPropagation(); send({ type: "meta", sessionId: s.id, patch: { favorite: !s.favorite } }); };
      const t = document.createElement("div"); t.className = "t";
      t.textContent = s.customTitle || s.title || s.id;
      t.prepend(star, document.createTextNode(" "));
      const sub = document.createElement("div"); sub.className = "s";
      sub.textContent = [s.projectName, s.gitBranch, `${s.messageCount}개`, (s.updatedAt || "").slice(0, 16).replace("T", " ")]
        .filter(Boolean).join(" · ");
      d.append(t, sub);
      d.onclick = () => { state.current = s.id; renderSessions(); $("send").disabled = false;
        $("detailTitle").textContent = s.customTitle || s.title || s.id;
        $("msgs").innerHTML = '<div class="empty">불러오는 중…</div>';
        send({ type: "open", sessionId: s.id }); };
      el.appendChild(d);
    }
  }

  function renderDetail(m) {
    const box = $("msgs"); box.innerHTML = "";
    for (const msg of m.messages) {
      if (msg.isMeta) continue;
      const text = (msg.blocks || []).map((b) => {
        if (b.type === "text") return b.text;
        if (b.type === "tool_use") return `🔧 ${b.name}`;
        if (b.type === "tool_result") return `↳ ${(b.output || "").slice(0, 400)}`;
        return null;
      }).filter(Boolean).join("\n");
      if (text.trim()) addMsg(msg.role, text, false);
    }
    for (const c of m.chat) addMsg(c.role, c.text, true);
    box.scrollTop = box.scrollHeight;
  }

  function addMsg(role, text, continued) {
    const box = $("msgs");
    if (box.querySelector(".empty")) box.innerHTML = "";
    const d = document.createElement("div");
    d.className = "msg " + role + (continued ? " continued" : "");
    const who = document.createElement("div"); who.className = "who";
    who.textContent = role === "user" ? "나" : role === "assistant" ? "Claude" : "도구";
    const body = document.createElement("div"); body.className = "body";
    body.textContent = text;
    d.append(who, body); box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    return body;
  }

  function renderActivity(items) {
    const el = $("activity"); el.innerHTML = "";
    if (!items || !items.length) { el.innerHTML = '<div>아직 활동이 없어요.</div>'; return; }
    for (const a of items) {
      const d = document.createElement("div");
      const b = document.createElement("b"); b.textContent = a.text;
      d.textContent = (a.ts || "").slice(5, 16).replace("T", " ") + " ";
      d.appendChild(b);
      el.appendChild(d);
    }
  }

  function renderReminders(items) {
    const el = $("reminders"); el.innerHTML = "";
    if (!items.length) { el.innerHTML = '<div style="color:var(--dim)">예약된 리마인더 없음</div>'; return; }
    for (const r of items) {
      const d = document.createElement("div");
      const left = document.createElement("span");
      const when = r.time ? new Date(r.time * 1000).toLocaleTimeString("ko-KR") : "";
      left.textContent = `${when} — ${r.note}`;
      const x = document.createElement("a"); x.textContent = "취소";
      x.onclick = () => send({ type: "cancel_remind", id: r.id });
      d.append(left, x); el.appendChild(d);
    }
  }

  let toastTimer;
  function toast(text) {
    const t = $("toast"); t.textContent = text; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 6000);
  }

  // ---- 입력 ----
  $("send").onclick = doSend;
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
  });
  function doSend() {
    const text = $("input").value.trim();
    if (!text || !state.current) return;
    $("input").value = ""; $("send").disabled = true;
    send({ type: "chat", sessionId: state.current, text });
  }
  $("rAdd").onclick = () => {
    const note = $("rNote").value.trim();
    const sec = Number($("rSec").value);
    if (!note) return toast("리마인더 메모를 입력하세요.");
    send({ type: "remind", seconds: sec, note });
    $("rNote").value = "";
  };

  connect();
})();
</script>
</body>
</html>
