<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Cowork Sync</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  </head>
  <body>
    <div id="app">
      <!-- 사이드바 -->
      <aside id="sidebar" class="sidebar">
        <header class="side-head">
          <button id="menuBack" class="icon-btn only-mobile" title="목록" aria-label="목록">☰</button>
          <h1>💬 Cowork Sync</h1>
          <a class="gfy-link" href="/graphfy" title="Graphfy — 나의 그래프">🕸️</a>
        </header>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="대화 검색…" autocomplete="off" />
        </div>
        <div id="facets" class="facets"></div>
        <div id="list" class="list" aria-live="polite">불러오는 중…</div>
        <footer id="sideFoot" class="side-foot"></footer>
      </aside>

      <!-- 대화 상세 -->
      <main id="detail" class="detail">
        <div class="empty" id="emptyState">
          <div class="empty-emoji">💬</div>
          <p>왼쪽에서 대화를 선택하세요.</p>
          <p class="muted">Claude Code 세션을 어느 기기에서든 보고 정리할 수 있어요.</p>
        </div>
      </main>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
